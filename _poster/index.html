<style>
/* layout: one 4:5 poster — headline block on top, three phones fanned across the lower half, URL bar at the foot */
:root{--blue:#0F2188;--deep:#0A1663;--green:#71F48A;--white:#FFFFFF;--soft:rgba(255,255,255,.82);
  --font:"Poppins","Prompt",system-ui,sans-serif;color-scheme:dark}
body{background:#E9ECF7;margin:0;padding-inline:16px;padding-block:24px;font-family:var(--font)}
.poster{position:relative;width:100%;max-width:540px;margin:0 auto;aspect-ratio:4/5;overflow:hidden;background:var(--blue);color:var(--white);container-type:inline-size}
.poster::before{content:"";position:absolute;left:-30%;right:-30%;bottom:-40%;height:85%;border-radius:50%;
  background:radial-gradient(closest-side,rgba(113,244,138,.42),rgba(113,244,138,0));pointer-events:none}
.poster::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.035) 0 1.2cqw,transparent 1.2cqw 4.8cqw);pointer-events:none}
.top{position:absolute;z-index:2;left:7cqw;right:7cqw;top:6cqw;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:2cqw;background:var(--white);border-radius:99px;padding:1.3cqw 3.2cqw 1.3cqw 2cqw}
.brand img{height:6.2cqw;width:auto;display:block}
.brand span{font-size:2.9cqw;font-weight:600;color:var(--blue)}
.eyebrow{font-family:"Poppins",sans-serif;font-size:2.5cqw;font-weight:600;letter-spacing:.16em;color:var(--green)}
.head{position:absolute;z-index:2;left:7cqw;right:7cqw;top:19.5cqw;display:grid;gap:2.4cqw}
h1{margin:0;font-size:9cqw;line-height:1.1;font-weight:700;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--green)}
.sub{margin:0;font-size:3.4cqw;line-height:1.45;font-weight:400;color:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:1.6cqw;margin-top:.8cqw}
.chips span{font-size:2.7cqw;font-weight:500;padding:1.1cqw 2.6cqw;border-radius:99px;background:rgba(255,255,255,.1);box-shadow:inset 0 0 0 .25cqw rgba(255,255,255,.22);white-space:nowrap}
.phones{position:absolute;z-index:1;left:0;right:0;top:68cqw;height:70cqw}
.ph{position:absolute;aspect-ratio:750/1624;border-radius:5.6cqw;background:#050A33;padding:1.1cqw;box-shadow:0 3cqw 7cqw rgba(3,8,50,.55),inset 0 0 0 .4cqw #2A3699}
.ph img{display:block;width:100%;height:100%;object-fit:cover;border-radius:4.6cqw}
.ph::after{content:"";position:absolute;top:2.2cqw;left:50%;width:9cqw;height:2.6cqw;margin-left:-4.5cqw;border-radius:99px;background:#050A33}
.ph.l{width:30cqw;left:6cqw;top:8cqw;transform:rotate(-8deg)}
.ph.r{width:30cqw;right:6cqw;top:8cqw;transform:rotate(8deg)}
.ph.c{width:36cqw;left:32cqw;top:0;z-index:2;box-shadow:0 4cqw 9cqw rgba(3,8,50,.65),inset 0 0 0 .4cqw #2A3699}
body.solo{padding:0;background:var(--blue)}body.solo .poster{max-width:none}
.foot{position:absolute;z-index:3;left:5cqw;right:5cqw;bottom:4.5cqw;box-shadow:0 2cqw 6cqw rgba(3,8,50,.35);display:flex;align-items:center;justify-content:space-between;gap:3cqw;
  background:var(--white);color:var(--blue);border-radius:4cqw;padding:2.6cqw 3.6cqw}
.foot b{font-family:"Poppins",sans-serif;font-size:4.6cqw;font-weight:700;letter-spacing:-.01em}
.foot small{display:block;font-size:2.7cqw;font-weight:500;color:#3B4677}
.foot .go{flex:none;display:grid;place-items:center;width:9cqw;height:9cqw;border-radius:50%;background:var(--green);color:var(--blue);font-family:"Poppins",sans-serif;font-weight:800;font-size:4.6cqw}
</style>
